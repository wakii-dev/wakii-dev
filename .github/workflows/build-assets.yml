name: Build profile assets

on:
  schedule:
    - cron: "23 3 * * *" # daily ~03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 3D contribution graph ----
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: wakii-dev

      # ---- radar: Review axis mirrors the PR count (bot reviews aren't
      #      calendar-countable, so the action plots ~0) ----
      - name: Patch 3D radar Review axis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: wakii-dev
        run: python3 scripts/patch_3d_review.py

      # ---- theme-neutral 3D graph: ONE svg that reads well on BOTH GitHub
      #      light and dark canvases (transparent bg, mid-tone cells/text).
      #      prefers-color-scheme follows the viewer's OS, not the GitHub
      #      theme picker, and camo caches one variant — a neutral palette
      #      is the only option that never shows the wrong theme. ----
      - name: Theme-neutralize animated 3D
        run: |
          sed -i -e 's|<rect x="0" y="0" width="1280" height="850" fill="#ffffff"></rect>||' \
                 -e 's/fill="rgb(239, 239, 239)"/fill="rgb(148, 152, 168)"/g' \
                 -e 's/fill="rgb(200, 200, 200)"/fill="rgb(118, 122, 138)"/g' \
                 -e 's/fill="rgb(167, 167, 167)"/fill="rgb(90, 94, 110)"/g' \
                 -e 's/fill="#00000f"/fill="#94a3b8"/g' \
                 -e 's/fill="#111133"/fill="#94a3b8"/g' \
                 -e 's/fill="gray"/fill="#7d8590"/g' \
                 -e 's/ stroke="#ffffff" stroke-width="1px"//g' \
                 -e 's/ stroke="#ffffff" stroke-width="2px"//g' \
                 -e 's/ stroke="#ffffff"//g' \
            profile-3d-contrib/profile-green-animate.svg
          rm -f profile-3d-contrib/profile-green-animate-dark.svg

      # ---- Mission-control stats panel (self-rendered, no third-party service) ----
      - name: Render stats panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: wakii-dev
        run: python3 scripts/render_stats.py

      # ---- cache-bust README image URLs whenever their asset changed,
      #      so profile visitors never get a stale CDN/browser copy ----
      - name: Bump README cache-busting versions
        run: |
          python3 - <<'PY'
          import re, subprocess, time
          ts = str(int(time.time()))
          def changed(p):
              return subprocess.run(["git", "diff", "--quiet", "HEAD", "--", p]).returncode != 0
          md = open("README.md").read()
          if changed("assets/mission-control.svg"):
              md = re.sub(r"assets/mission-control\.svg(\?v=\d+)?",
                          f"assets/mission-control.svg?v={ts}", md)
          if changed("profile-3d-contrib/profile-green-animate.svg"):
              md = re.sub(r"profile-3d-contrib/profile-green-animate\.svg(\?v=\d+)?",
                          rf"profile-3d-contrib/profile-green-animate.svg?v={ts}", md)
          open("README.md", "w").write(md)
          PY

      # ---- commit generated assets ----
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-3d-contrib assets/mission-control.svg || true
          if git diff --cached --quiet; then
            echo "nothing to update"
          else
            git commit -m "assets: refresh generated profile assets [skip ci]"
            git push
          fi
