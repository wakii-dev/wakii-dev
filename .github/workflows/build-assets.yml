name: Build profile assets

on:
  schedule:
    - cron: "23 3 * * *" # daily ~03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 3D contribution graph ----
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: wakii-dev

      # ---- dark variant of the animated 3D graph (profile is dark-themed) ----
      - name: Dark-patch animated 3D
        run: |
          sed -e 's/fill="rgb(239, 239, 239)"/fill="rgb(22, 27, 34)"/g' \
              -e 's/fill="rgb(200, 200, 200)"/fill="rgb(30, 36, 44)"/g' \
              -e 's/fill="rgb(167, 167, 167)"/fill="rgb(45, 51, 58)"/g' \
              -e 's/fill="#ffffff"/fill="#0d1117"/g' \
              -e 's/stroke: gray/stroke: #6e7681/g' \
              -e 's/fill="gray"/fill="#8b949e"/g' \
              -e 's/<style>\*/<style>text { fill: #e6edf3; }\*/' \
            profile-3d-contrib/profile-green-animate.svg \
            > profile-3d-contrib/profile-green-animate-dark.svg

      # ---- Mission-control stats panel (self-rendered, no third-party service) ----
      - name: Render stats panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: wakii-dev
        run: python3 scripts/render_stats.py

      # ---- commit generated assets ----
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets/mission-control.svg || true
          if git diff --cached --quiet; then
            echo "nothing to update"
          else
            git commit -m "assets: refresh generated profile assets [skip ci]"
            git push
          fi
