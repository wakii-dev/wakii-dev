name: Build profile assets

on:
  schedule:
    - cron: "23 3 * * *" # daily ~03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 3D contribution graph ----
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: wakii-dev

      # ---- Mission-control stats panel (self-rendered, no third-party service) ----
      - name: Render stats panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: wakii-dev
        run: python3 scripts/render_stats.py

      # ---- commit generated assets ----
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets/mission-control.svg || true
          if git diff --cached --quiet; then
            echo "nothing to update"
          else
            git commit -m "assets: refresh generated profile assets [skip ci]"
            git push
          fi
