<svg width="840" height="470" viewBox="0 0 840 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wakii agent crew">
  <style>
    :root {
      --bg1: #0b1020; --bg2: #140b26; --panel: #111834; --stroke: #7c6cf055; --stroke-soft: #7c6cf033;
      --grid: #7c6cf017;
      --accent: #f0abfc; --t1: #e2e8f0; --t2: #94a3b8; --t3: #64748b; --t4: #475569;
      --pink: #f0abfc; --cyan: #67e8f9; --vio: #a78bfa; --grn: #34d399; --amb: #fbbf24;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg1: #f8f7fc; --bg2: #f1ebfa; --panel: #ffffff; --stroke: #a78bfa66; --stroke-soft: #a78bfa3d;
        --grid: #7c6cf01c;
        --accent: #C026D3; --t1: #1e293b; --t2: #475569; --t3: #64748b; --t4: #94a3b8;
        --pink: #C026D3; --cyan: #0891b2; --vio: #7c3aed; --grn: #059669; --amb: #b45309;
      }
    }
    .bg1 { stop-color: var(--bg1); } .bg2 { stop-color: var(--bg2); }
    .panel { fill: var(--panel); stroke: var(--stroke-soft); }
    .frame { stroke: var(--stroke); }
    .grid-p { stroke: var(--grid); }
    .title { fill: var(--accent); } .footnote { fill: var(--t4); }
    .name { fill: var(--t1); } .desc { fill: var(--t2); } .id { fill: var(--t4); }
    .brk-p { stroke: var(--pink); } .brk-c { stroke: var(--cyan); } .brk-v { stroke: var(--vio); }
    .brk-g { stroke: var(--grn); } .brk-a { stroke: var(--amb); }
    .led-p { fill: var(--pink); } .led-c { fill: var(--cyan); } .led-v { fill: var(--vio); }
    .led-g { fill: var(--grn); } .led-a { fill: var(--amb); }
    .bar-p { fill: var(--pink); } .bar-c { fill: var(--cyan); } .bar-v { fill: var(--vio); }
    .bar-g { fill: var(--grn); } .bar-a { fill: var(--amb); }
    .chip-p { fill: var(--pink); fill-opacity: 0.13; }
    .chip-c { fill: var(--cyan); fill-opacity: 0.13; }
    .chip-v { fill: var(--vio); fill-opacity: 0.13; }
    .chip-g { fill: var(--grn); fill-opacity: 0.13; }
    .chip-a { fill: var(--amb); fill-opacity: 0.13; }
    .corners { fill: none; stroke-width: 2; opacity: 0.55; }
    .sweep-a { stop-color: var(--pink); }
  </style>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg1"/><stop offset="1" class="bg2"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sweep-a" stop-opacity="0"/>
      <stop offset="0.5" class="sweep-a" stop-opacity="0.07"/>
      <stop offset="1" class="sweep-a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 120) scale(340)">
      <stop offset="0" class="bg2" stop-opacity="0.9"/><stop offset="1" class="bg2" stop-opacity="0"/>
    </radialGradient>
    <filter id="aglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridp" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" class="grid-p" stroke-width="1"/>
    </pattern>
    <g id="corners">
      <path d="M1 11 V4 Q1 1 4 1 H11"/>
      <path d="M241 1 H248 Q251 1 251 4 V11"/>
      <path d="M1 101 V108 Q1 111 4 111 H11"/>
      <path d="M241 111 H248 Q251 111 251 108 V101"/>
    </g>
  </defs>

  <rect x="2" y="2" width="836" height="466" rx="16" fill="url(#abg)" class="frame" stroke-width="1.5"/>
  <rect x="2" y="2" width="836" height="466" rx="16" fill="url(#gridp)"/>

  <text x="26" y="42" font-family="Menlo, monospace" font-size="16" font-weight="700" class="title" filter="url(#aglow)">▸ MEET THE CREW</text>
  <text x="814" y="42" text-anchor="end" font-family="Menlo, monospace" font-size="12" class="footnote">9 agents · ships with every wakii install</text>

  <!-- radar sweep -->
  <rect x="2" y="60" width="836" height="44" fill="url(#sweep)">
    <animate attributeName="y" values="60;400;60" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- AGT-01 spec-critic -->
  <g font-family="Menlo, monospace">
    <rect x="26" y="64" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(26,64)" class="corners brk-p"/>
    <rect x="40" y="80" width="36" height="36" rx="9" class="chip-p"/>
    <text x="48" y="106" font-size="22">📐</text>
    <text x="88" y="98" font-size="14" font-weight="700" class="name">spec-critic</text>
    <text x="88" y="116" font-size="10.5" class="desc">adversarial spec review —</text>
    <text x="88" y="130" font-size="10.5" class="desc">kills ambiguity before code</text>
    <circle cx="262" cy="82" r="3.5" class="led-p"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <text x="264" y="100" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-01</text>
    <rect x="40" y="154" width="224" height="3" rx="1.5" class="bar-p"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-02 impact-analyst -->
  <g font-family="Menlo, monospace">
    <rect x="294" y="64" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(294,64)" class="corners brk-c"/>
    <rect x="308" y="80" width="36" height="36" rx="9" class="chip-c"/>
    <text x="316" y="106" font-size="22">🧭</text>
    <text x="356" y="98" font-size="14" font-weight="700" class="name">impact-analyst</text>
    <text x="356" y="116" font-size="10.5" class="desc">phase-0 blast radius: what a</text>
    <text x="356" y="130" font-size="10.5" class="desc">change touches, everywhere</text>
    <circle cx="530" cy="82" r="3.5" class="led-c"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.27s" repeatCount="indefinite"/></circle>
    <text x="532" y="100" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-02</text>
    <rect x="308" y="154" width="224" height="3" rx="1.5" class="bar-c"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0.27s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-03 plan-critic -->
  <g font-family="Menlo, monospace">
    <rect x="562" y="64" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(562,64)" class="corners brk-v"/>
    <rect x="576" y="80" width="36" height="36" rx="9" class="chip-v"/>
    <text x="584" y="106" font-size="22">🗺️</text>
    <text x="624" y="98" font-size="14" font-weight="700" class="name">plan-critic</text>
    <text x="624" y="116" font-size="10.5" class="desc">reviews the plan + task DAG —</text>
    <text x="624" y="130" font-size="10.5" class="desc">catches deadlocks pre-execution</text>
    <circle cx="798" cy="82" r="3.5" class="led-v"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.54s" repeatCount="indefinite"/></circle>
    <text x="800" y="100" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-03</text>
    <rect x="576" y="154" width="224" height="3" rx="1.5" class="bar-v"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0.54s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-04 task-executor -->
  <g font-family="Menlo, monospace">
    <rect x="26" y="192" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(26,192)" class="corners brk-g"/>
    <rect x="40" y="208" width="36" height="36" rx="9" class="chip-g"/>
    <text x="48" y="234" font-size="22">⚙️</text>
    <text x="88" y="226" font-size="14" font-weight="700" class="name">task-executor</text>
    <text x="88" y="244" font-size="10.5" class="desc">one plan task, end-to-end:</text>
    <text x="88" y="258" font-size="10.5" class="desc">code, tests, commits, gate</text>
    <circle cx="262" cy="210" r="3.5" class="led-g"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.81s" repeatCount="indefinite"/></circle>
    <text x="264" y="228" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-04</text>
    <rect x="40" y="282" width="224" height="3" rx="1.5" class="bar-g"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0.81s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-05 code-reviewer -->
  <g font-family="Menlo, monospace">
    <rect x="294" y="192" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(294,192)" class="corners brk-a"/>
    <rect x="308" y="208" width="36" height="36" rx="9" class="chip-a"/>
    <text x="316" y="234" font-size="22">🔍</text>
    <text x="356" y="226" font-size="14" font-weight="700" class="name">code-reviewer</text>
    <text x="356" y="244" font-size="10.5" class="desc">every diff reviewed P0→P2</text>
    <text x="356" y="258" font-size="10.5" class="desc">before anything merges</text>
    <circle cx="530" cy="210" r="3.5" class="led-a"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.08s" repeatCount="indefinite"/></circle>
    <text x="532" y="228" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-05</text>
    <rect x="308" y="282" width="224" height="3" rx="1.5" class="bar-a"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="1.08s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-06 verifier -->
  <g font-family="Menlo, monospace">
    <rect x="562" y="192" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(562,192)" class="corners brk-p"/>
    <rect x="576" y="208" width="36" height="36" rx="9" class="chip-p"/>
    <text x="584" y="234" font-size="22">✅</text>
    <text x="624" y="226" font-size="14" font-weight="700" class="name">verifier</text>
    <text x="624" y="244" font-size="10.5" class="desc">evidence before claims —</text>
    <text x="624" y="258" font-size="10.5" class="desc">gate criteria, proven green</text>
    <circle cx="798" cy="210" r="3.5" class="led-p"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.35s" repeatCount="indefinite"/></circle>
    <text x="800" y="228" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-06</text>
    <rect x="576" y="282" width="224" height="3" rx="1.5" class="bar-p"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="1.35s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-07 security-audit -->
  <g font-family="Menlo, monospace">
    <rect x="26" y="320" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(26,320)" class="corners brk-c"/>
    <rect x="40" y="336" width="36" height="36" rx="9" class="chip-c"/>
    <text x="48" y="362" font-size="22">🛡️</text>
    <text x="88" y="354" font-size="14" font-weight="700" class="name">security-audit</text>
    <text x="88" y="372" font-size="10.5" class="desc">injection, authz, secrets —</text>
    <text x="88" y="386" font-size="10.5" class="desc">pre-release security pass</text>
    <circle cx="262" cy="338" r="3.5" class="led-c"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.62s" repeatCount="indefinite"/></circle>
    <text x="264" y="356" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-07</text>
    <rect x="40" y="410" width="224" height="3" rx="1.5" class="bar-c"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="1.62s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-08 rollback-fixer -->
  <g font-family="Menlo, monospace">
    <rect x="294" y="320" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(294,320)" class="corners brk-v"/>
    <rect x="308" y="336" width="36" height="36" rx="9" class="chip-v"/>
    <text x="316" y="362" font-size="22">↩️</text>
    <text x="356" y="354" font-size="14" font-weight="700" class="name">rollback-fixer</text>
    <text x="356" y="372" font-size="10.5" class="desc">when agents diverge — safe</text>
    <text x="356" y="386" font-size="10.5" class="desc">revert, preserved audit trail</text>
    <circle cx="530" cy="338" r="3.5" class="led-v"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.89s" repeatCount="indefinite"/></circle>
    <text x="532" y="356" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-08</text>
    <rect x="308" y="410" width="224" height="3" rx="1.5" class="bar-v"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="1.89s" repeatCount="indefinite"/></rect>
  </g>

  <!-- AGT-09 designer -->
  <g font-family="Menlo, monospace">
    <rect x="562" y="320" width="252" height="112" rx="12" class="panel"/>
    <use href="#corners" transform="translate(562,320)" class="corners brk-g"/>
    <rect x="576" y="336" width="36" height="36" rx="9" class="chip-g"/>
    <text x="584" y="362" font-size="22">🎨</text>
    <text x="624" y="354" font-size="14" font-weight="700" class="name">designer</text>
    <text x="624" y="372" font-size="10.5" class="desc">high-fidelity prototypes —</text>
    <text x="624" y="386" font-size="10.5" class="desc">3 directions before you pick</text>
    <circle cx="798" cy="338" r="3.5" class="led-g"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="2.16s" repeatCount="indefinite"/></circle>
    <text x="800" y="356" text-anchor="end" font-size="8.5" letter-spacing="1" class="id">AGT-09</text>
    <rect x="576" y="410" width="224" height="3" rx="1.5" class="bar-g"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="2.16s" repeatCount="indefinite"/></rect>
  </g>
</svg>
