<svg width="840" height="470" viewBox="0 0 840 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wakii agent crew">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#140b26"/>
    </linearGradient>
    <linearGradient id="abar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="aglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="836" height="466" rx="16" fill="url(#abg)" stroke="#7c6cf055" stroke-width="1.5"/>
  <text x="26" y="42" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#f0abfc" filter="url(#aglow)">▸ MEET THE CREW</text>
  <text x="814" y="42" text-anchor="end" font-family="Menlo, monospace" font-size="12" fill="#475569">ships with every wakii install</text>

  <!-- row 1 -->
  <g>
    <rect x="26" y="64" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="46" y="98" font-size="24">📐</text>
    <text x="82" y="96" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">spec-critic</text>
    <text x="82" y="114" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">adversarial spec review —</text>
    <text x="82" y="128" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">kills ambiguity before code</text>
    <rect x="46" y="146" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="294" y="64" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="314" y="98" font-size="24">🧭</text>
    <text x="350" y="96" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">impact-analyst</text>
    <text x="350" y="114" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">phase-0 blast radius:</text>
    <text x="350" y="128" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">what a change touches, everywhere</text>
    <rect x="314" y="146" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="562" y="64" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="582" y="98" font-size="24">🗺️</text>
    <text x="618" y="96" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">plan-critic</text>
    <text x="618" y="114" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">reviews the plan + task DAG —</text>
    <text x="618" y="128" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">catches deadlocks pre-execution</text>
    <rect x="582" y="146" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="26" y="192" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="46" y="226" font-size="24">⚙️</text>
    <text x="82" y="224" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">task-executor</text>
    <text x="82" y="242" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">one plan task, end-to-end:</text>
    <text x="82" y="256" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">code, tests, commits, gate</text>
    <rect x="46" y="274" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="294" y="192" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="314" y="226" font-size="24">🔍</text>
    <text x="350" y="224" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">code-reviewer</text>
    <text x="350" y="242" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">every diff reviewed P0→P2</text>
    <text x="350" y="256" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">before anything merges</text>
    <rect x="314" y="274" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="562" y="192" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="582" y="226" font-size="24">✅</text>
    <text x="618" y="224" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">verifier</text>
    <text x="618" y="242" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">evidence before claims —</text>
    <text x="618" y="256" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">gate criteria, proven green</text>
    <rect x="582" y="274" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- row 3 -->
  <g>
    <rect x="26" y="320" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="46" y="354" font-size="24">🛡️</text>
    <text x="82" y="352" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">security-audit</text>
    <text x="82" y="370" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">injection, authz, secrets —</text>
    <text x="82" y="384" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">pre-release security pass</text>
    <rect x="46" y="402" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="294" y="320" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="314" y="354" font-size="24">↩️</text>
    <text x="350" y="352" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">rollback-fixer</text>
    <text x="350" y="370" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">when agents diverge —</text>
    <text x="350" y="384" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">safe revert, preserved trail</text>
    <rect x="314" y="402" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="2.1s" repeatCount="indefinite"/></rect>
  </g>
  <g>
    <rect x="562" y="320" width="252" height="112" rx="10" fill="#111834" stroke="#7c6cf033"/>
    <text x="582" y="354" font-size="24">🎨</text>
    <text x="618" y="352" font-family="Menlo, monospace" font-size="14" font-weight="700" fill="#e2e8f0">designer</text>
    <text x="618" y="370" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">high-fidelity prototypes —</text>
    <text x="618" y="384" font-family="Menlo, monospace" font-size="11" fill="#94a3b8">3 directions before you pick</text>
    <rect x="582" y="402" width="212" height="3" rx="1.5" fill="url(#abar)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="2.4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
