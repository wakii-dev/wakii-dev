<svg width="840" height="220" viewBox="0 0 840 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="how the crew ships">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#140b26"/>
    </linearGradient>
    <linearGradient id="pline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/><stop offset="0.5" stop-color="#f0abfc"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="pglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="836" height="216" rx="14" fill="url(#pbg)" stroke="#7c6cf055" stroke-width="1.5"/>
  <text x="26" y="38" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#f0abfc" filter="url(#pglow)">▸ HOW THE CREW SHIPS</text>
  <text x="814" y="38" text-anchor="end" font-family="Menlo, monospace" font-size="11" fill="#475569">one idea in · one PR out</text>

  <!-- connector -->
  <path id="flow" d="M 60 118 H 780" stroke="#7c6cf033" stroke-width="3" fill="none"/>

  <!-- traveling pulse -->
  <circle r="6" fill="#f0abfc" filter="url(#pglow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>

  <g font-family="Menlo, monospace" text-anchor="middle">
    <g>
      <rect x="22" y="88" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="65" y="115" font-size="18">💡</text>
      <text x="65" y="136" font-size="11" fill="#e2e8f0">idea</text>
    </g>
    <g>
      <rect x="146" y="88" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="189" y="115" font-size="18">🧭</text>
      <text x="189" y="136" font-size="11" fill="#e2e8f0">impact</text>
      <text x="189" y="160" font-size="9.5" fill="#64748b">phase0-analyst</text>
    </g>
    <g>
      <rect x="270" y="88" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="313" y="115" font-size="18">🗺️</text>
      <text x="313" y="136" font-size="11" fill="#e2e8f0">plan</text>
      <text x="313" y="160" font-size="9.5" fill="#64748b">plan-critic</text>
    </g>
    <g>
      <rect x="394" y="88" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="437" y="115" font-size="18">📋</text>
      <text x="437" y="136" font-size="11" fill="#e2e8f0">bracket</text>
      <text x="437" y="160" font-size="9.5" fill="#64748b">spec-critic</text>
    </g>
    <g>
      <rect x="518" y="88" width="86" height="60" rx="10" fill="#111834" stroke="#34d39966"/>
      <text x="561" y="112" font-size="15">⚙️⚙️⚙️</text>
      <text x="561" y="136" font-size="11" fill="#e2e8f0">parallel SFs</text>
      <text x="561" y="160" font-size="9.5" fill="#64748b">executor+reviewer</text>
    </g>
    <g>
      <rect x="642" y="88" width="86" height="60" rx="10" fill="#111834" stroke="#fbbf2466"/>
      <text x="685" y="115" font-size="18">🚦</text>
      <text x="685" y="136" font-size="11" fill="#e2e8f0">gates</text>
      <text x="685" y="160" font-size="9.5" fill="#64748b">verifier+audit</text>
    </g>
    <g>
      <rect x="766" y="88" width="58" height="60" rx="10" fill="#111834" stroke="#34d39966"/>
      <text x="795" y="115" font-size="18">🚢</text>
      <text x="795" y="136" font-size="11" fill="#e2e8f0">PR</text>
    </g>
  </g>

  <text x="420" y="196" text-anchor="middle" font-family="Menlo, monospace" font-size="11.5" fill="#7dd3fc">
    gates are adversarial by design — <tspan fill="#f0abfc">self-approve isn't a gate</tspan>
  </text>
</svg>
