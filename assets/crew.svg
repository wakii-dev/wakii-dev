<svg width="840" height="210" viewBox="0 0 840 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="agent crew">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#140b26"/>
    </linearGradient>
    <filter id="cglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card template: captain -->
  <g>
    <rect x="2" y="2" width="268" height="204" rx="14" fill="url(#cbg)" stroke="#7c6cf055" stroke-width="1.5"/>
    <circle cx="136" cy="62" r="30" fill="#111834" stroke="#f0abfc" stroke-width="2" filter="url(#cglow)"/>
    <text x="136" y="72" text-anchor="middle" font-size="30">🧑‍💻</text>
    <text x="136" y="122" text-anchor="middle" font-family="Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">HoiVu</text>
    <text x="136" y="146" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#94a3b8">captain · product · judgment</text>
    <circle cx="80" cy="170" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="174" font-family="Menlo, monospace" font-size="12" fill="#34d399">approves the ships</text>
  </g>

  <!-- card: Claude -->
  <g>
    <rect x="286" y="2" width="268" height="204" rx="14" fill="url(#cbg)" stroke="#d9775799" stroke-width="1.5"/>
    <circle cx="420" cy="62" r="30" fill="#111834" stroke="#d97757" stroke-width="2" filter="url(#cglow)">
      <animate attributeName="stroke" values="#d97757;#f0abfc;#d97757" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="420" y="72" text-anchor="middle" font-size="30">🤖</text>
    <text x="420" y="122" text-anchor="middle" font-family="Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">Claude</text>
    <text x="420" y="146" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#94a3b8">Anthropic · opus · long-haul builds</text>
    <circle cx="364" cy="170" r="4" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="376" y="174" font-family="Menlo, monospace" font-size="12" fill="#fbbf24">wrote most of this repo</text>
  </g>

  <!-- card: Kiro -->
  <g>
    <rect x="570" y="2" width="268" height="204" rx="14" fill="url(#cbg)" stroke="#67e8f966" stroke-width="1.5"/>
    <circle cx="704" cy="62" r="30" fill="#111834" stroke="#67e8f9" stroke-width="2" filter="url(#cglow)">
      <animate attributeName="stroke" values="#67e8f9;#a78bfa;#67e8f9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="704" y="72" text-anchor="middle" font-size="30">🛠️</text>
    <text x="704" y="122" text-anchor="middle" font-family="Menlo, monospace" font-size="17" font-weight="700" fill="#e2e8f0">Kiro</text>
    <text x="704" y="146" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#94a3b8">AWS · spec-driven sidekick</text>
    <circle cx="648" cy="170" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="174" font-family="Menlo, monospace" font-size="12" fill="#34d399">specs → reality</text>
  </g>
</svg>
