<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wakii × HoiVu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#140b26"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#67e8f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="1 0" to="-1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7c6cf01a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="836" height="236" rx="16" fill="url(#bg)" stroke="#7c6cf055" stroke-width="1.5"/>
  <rect x="2" y="2" width="836" height="236" rx="16" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle cx="70" cy="60" r="4" fill="#f0abfc">
      <animate attributeName="cy" values="60;52;60" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="44" r="3" fill="#67e8f9">
      <animate attributeName="cy" values="44;54;44" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="782" cy="52" r="4" fill="#a78bfa">
      <animate attributeName="cy" values="52;44;52" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="712" cy="40" r="3" fill="#f0abfc">
      <animate attributeName="cy" values="40;50;40" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="4.6s" repeatCount="indefinite"/>
    </circle>

    <text x="420" y="118" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="14" fill="url(#shine)" filter="url(#glow)">WAKII</text>

    <rect x="250" y="140" width="340" height="2" fill="url(#line)"/>

    <text x="420" y="176" text-anchor="middle" font-size="19" fill="#c4b5fd">agentic IDE · superpowers team built-in</text>

    <text x="420" y="208" text-anchor="middle" font-size="14" fill="#7dd3fc" opacity="0.9">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
      by HoiVu × AI agents (Claude · Kiro)
    </text>
  </g>
</svg>
