<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wakii × HoiVu">
  <style>
    :root {
      --bg1: #0b1020; --bg2: #140b26; --stroke: #7c6cf055; --grid: #7c6cf01a;
      --pink: #f0abfc; --cyan: #67e8f9; --vio: #a78bfa;
      --sub: #c4b5fd; --by: #7dd3fc;
      --sh-a: #a78bfa; --sh-b: #f0abfc; --sh-c: #67e8f9;
      --ln-a: #6D28D9; --ln-b: #f0abfc; --ln-c: #67e8f9;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg1: #f8f7fc; --bg2: #f2ecfb; --stroke: #a78bfa66; --grid: #7c6cf01f;
        --pink: #C026D3; --cyan: #0891b2; --vio: #7c3aed;
        --sub: #6D28D9; --by: #0369a1;
        --sh-a: #7c3aed; --sh-b: #c026d3; --sh-c: #0891b2;
        --ln-a: #7c3aed; --ln-b: #c026d3; --ln-c: #0891b2;
      }
    }
    .bg1 { stop-color: var(--bg1); } .bg2 { stop-color: var(--bg2); }
    .sh-a { stop-color: var(--sh-a); } .sh-b { stop-color: var(--sh-b); } .sh-c { stop-color: var(--sh-c); }
    .ln-a { stop-color: var(--ln-a); } .ln-b { stop-color: var(--ln-b); } .ln-c { stop-color: var(--ln-c); }
    .frame { stroke: var(--stroke); }
    .grid-p { stroke: var(--grid); }
    .dot-p { fill: var(--pink); } .dot-c { fill: var(--cyan); } .dot-v { fill: var(--vio); }
    .shine { fill: url(#shine); }
    .sub { fill: var(--sub); } .by { fill: var(--by); }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg1"/>
      <stop offset="1" class="bg2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="sh-a"/>
      <stop offset="0.5" class="sh-b"/>
      <stop offset="1" class="sh-c"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="ln-a" stop-opacity="0"/>
      <stop offset="0.5" class="ln-b" stop-opacity="0.9"/>
      <stop offset="1" class="ln-c" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="1 0" to="-1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" class="grid-p" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="836" height="236" rx="16" fill="url(#bg)" class="frame" stroke-width="1.5"/>
  <rect x="2" y="2" width="836" height="236" rx="16" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle cx="70" cy="60" r="4" class="dot-p">
      <animate attributeName="cy" values="60;52;60" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="44" r="3" class="dot-c">
      <animate attributeName="cy" values="44;54;44" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="782" cy="52" r="4" class="dot-v">
      <animate attributeName="cy" values="52;44;52" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="712" cy="40" r="3" class="dot-p">
      <animate attributeName="cy" values="40;50;40" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="4.6s" repeatCount="indefinite"/>
    </circle>

    <text x="420" y="118" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="14" class="shine" filter="url(#glow)">WAKII</text>

    <rect x="250" y="140" width="340" height="2" fill="url(#line)"/>

    <text x="420" y="176" text-anchor="middle" font-size="19" class="sub">agentic IDE · superpowers team built-in</text>

    <text x="420" y="208" text-anchor="middle" font-size="14" class="by" opacity="0.9">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
      by HoiVu × AI agents (Claude · Kiro)
    </text>
  </g>
</svg>
